[project]
name = "studio-forge-mcp"
dynamic = ["version"]
description = "Unified MCP creative, media (FFmpeg), SVG/document suite, and sqlite-vec semantic memory server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.30.0,<2",
    "openpyxl>=3.1.5",
    "pillow>=11.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
studio-forge-mcp = "studio_forge_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/studio_forge_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_forge_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
